<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Resume Coach — Enterprise Web Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for inline JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activePage, setActivePage] = useState('landing');
      const [isDarkMode, setIsDarkMode] = useState(true);

      // State for ATS Analysis
      const [resumeText, setResumeText] = useState("Senior Full-Stack & Mobile Engineer with 6+ years experience in React, Kotlin, Node.js, REST APIs, and AI integrations.");
      const [jobDesc, setJobDesc] = useState("Seeking Senior Engineer skilled in System Design, GraphQL, Jetpack Compose, CI/CD, and Gemini AI APIs.");
      const [atsResult, setAtsResult] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);

      // State for Mock Interview
      const [messages, setMessages] = useState([
        {
          id: 1,
          sender: 'ai',
          text: "Welcome to your Gemini AI Mock Interview! Tell me about a complex technical challenge you solved recently using the STAR framework.",
          time: "10:00 AM"
        }
      ]);
      const [userInput, setUserInput] = useState("");
      const [isMicOn, setIsMicOn] = useState(false);

      // State for Job Tracker
      const [applications, setApplications] = useState([
        { id: 1, company: 'Google', role: 'Senior Staff Engineer', location: 'Mountain View, CA', status: 'Interview', match: 94 },
        { id: 2, company: 'Stripe', role: 'Lead Frontend Architect', location: 'Remote', status: 'Applied', match: 89 },
        { id: 3, company: 'Linear', role: 'Product Engineer', location: 'San Francisco, CA', status: 'Wishlist', match: 96 },
        { id: 4, company: 'Netflix', role: 'Full Stack Tech Lead', location: 'Los Gatos, CA', status: 'Offer', match: 98 }
      ]);

      // Roadmap items
      const [roadmap, setRoadmap] = useState([
        { id: 1, week: 1, title: 'Master STAR Behavioral Framework', desc: 'Structure system refactoring scenarios with quantitative results.', done: true },
        { id: 2, week: 2, title: 'Deep Dive into Distributed Systems Design', desc: 'Caching policies, microservices, and high-concurrency DB scaling.', done: true },
        { id: 3, week: 3, title: 'ATS Keyword Alignment & Portfolio Polish', desc: 'Target key terms for staff-level engineering loops.', done: false },
        { id: 4, week: 4, title: 'Executive Mock Interviews & Negotiation', desc: 'Timed live AI mock rounds with automated feedback.', done: false }
      ]);

      const handleAnalyze = () => {
        setIsAnalyzing(true);
        setTimeout(() => {
          setAtsResult({
            score: 92,
            keywords: ['Kotlin', 'System Design', 'REST APIs', 'React', 'Gemini AI'],
            missing: ['GraphQL', 'Kubernetes', 'Automated CI/CD'],
            recommendations: [
              "Quantify recent achievements with performance metrics (e.g., 'reduced API response time by 35%').",
              "Include target domain keywords: GraphQL, Kubernetes."
            ],
            rewrites: [
              "Architected reactive frontend state flow using React 19 and WebSockets, handling 50k+ daily transactions.",
              "Engineered high-concurrency microservices reducing cloud deployment friction by 40%."
            ]
          });
          setIsAnalyzing(false);
        }, 1200);
      };

      const handleSendMessage = () => {
        if (!userInput.trim()) return;
        const newMsg = { id: Date.now(), sender: 'user', text: userInput, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) };
        setMessages(prev => [...prev, newMsg]);
        setUserInput("");
        setTimeout(() => {
          const aiReply = {
            id: Date.now()+1,
            sender: 'ai',
            text: `Feedback (Score 90/100):\nGreat structuring! Emphasizing the quantitative impact strengthens your STAR response significantly.\n\nNext Question: How do you resolve conflicts regarding software architecture trade-offs with cross-functional managers?`,
            time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
          };
          setMessages(prev => [...prev, aiReply]);
        }, 1000);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {/* Navigation Bar */}
          <header className="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800 px-4 lg:px-8 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActivePage('landing')}>
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-500 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/20">
                ✨
              </div>
              <div>
                <span className="font-extrabold text-base tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">
                  AI Resume Coach
                </span>
                <span className="block text-[10px] font-bold text-indigo-400 tracking-widest uppercase -mt-1">
                  SaaS Web Edition
                </span>
              </div>
            </div>

            <nav className="hidden md:flex items-center gap-1 bg-slate-900/60 p-1.5 rounded-2xl border border-slate-800 text-xs font-semibold">
              {[
                { id: 'dashboard', label: 'Dashboard' },
                { id: 'ats', label: 'ATS Analyzer' },
                { id: 'builder', label: 'Resume Builder' },
                { id: 'interview', label: 'Mock Interview' },
                { id: 'roadmap', label: 'Roadmap' },
                { id: 'tracker', label: 'Job Tracker' },
                { id: 'pricing', label: 'Pricing' }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setActivePage(item.id)}
                  className={`px-3 py-1.5 rounded-xl transition-all ${
                    activePage === item.id
                      ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/30 font-bold'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  {item.label}
                </button>
              ))}
            </nav>

            <div className="flex items-center gap-3">
              <button
                onClick={() => setActivePage('profile')}
                className="flex items-center gap-2 pl-3 border-l border-slate-800 text-xs font-semibold text-slate-300 hover:text-white"
              >
                <div className="w-7 h-7 rounded-full bg-indigo-600/30 border border-indigo-500/50 flex items-center justify-center font-bold text-indigo-300 text-xs">
                  A
                </div>
                <span className="hidden sm:inline">Alex Morgan</span>
              </button>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-8">
            {/* Landing Page */}
            {activePage === 'landing' && (
              <div className="space-y-16 py-8">
                <div className="text-center space-y-6 max-w-3xl mx-auto">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-bold uppercase tracking-wider">
                    ✨ Enterprise AI Career Accelerator
                  </div>
                  <h1 className="text-4xl sm:text-6xl font-black text-white tracking-tight leading-tight">
                    Land Your Dream Job with <span className="bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">Enterprise AI Intelligence</span>
                  </h1>
                  <p className="text-slate-400 text-sm sm:text-base leading-relaxed">
                    Bypass ATS screeners, master high-stakes technical interviews, and follow personalized career roadmaps powered by Gemini AI architecture.
                  </p>
                  <div className="flex flex-wrap justify-center gap-4 pt-2">
                    <button
                      onClick={() => setActivePage('ats')}
                      className="px-8 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-xl shadow-indigo-500/25 transition-all"
                    >
                      Upload Resume for ATS Scan →
                    </button>
                    <button
                      onClick={() => setActivePage('interview')}
                      className="px-8 py-3.5 rounded-xl bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-200 font-bold text-sm"
                    >
                      Try Mock Interview
                    </button>
                  </div>
                </div>

                {/* Features Grid */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="p-6 rounded-2xl bg-slate-900/40 border border-slate-800 space-y-3">
                    <div className="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center font-bold">📄</div>
                    <h3 className="font-bold text-white text-base">ATS Optimizer</h3>
                    <p className="text-xs text-slate-400 leading-relaxed">Instant keyword density scoring and tailored AI bullet point rewrites.</p>
                  </div>
                  <div className="p-6 rounded-2xl bg-slate-900/40 border border-slate-800 space-y-3">
                    <div className="w-10 h-10 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center font-bold">🎙️</div>
                    <h3 className="font-bold text-white text-base">STAR Mock Coach</h3>
                    <p className="text-xs text-slate-400 leading-relaxed">Real-time interview simulator evaluating responses with actionable scoring.</p>
                  </div>
                  <div className="p-6 rounded-2xl bg-slate-900/40 border border-slate-800 space-y-3">
                    <div className="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center font-bold">🗺️</div>
                    <h3 className="font-bold text-white text-base">4-Week Career Roadmap</h3>
                    <p className="text-xs text-slate-400 leading-relaxed">Step-by-step milestones to transition smoothly into Staff Engineer roles.</p>
                  </div>
                </div>
              </div>
            )}

            {/* Dashboard */}
            {activePage === 'dashboard' && (
              <div className="space-y-8">
                <div className="p-8 rounded-3xl bg-gradient-to-r from-indigo-900/60 via-purple-900/40 to-slate-900 border border-indigo-500/30 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <div>
                    <h1 className="text-2xl font-black text-white">Welcome back, Alex Morgan 👋</h1>
                    <p className="text-xs text-slate-300 mt-1">Senior Staff Engineer Track • Target: Google, Stripe, Meta</p>
                  </div>
                  <button onClick={() => setActivePage('ats')} className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow-lg shadow-indigo-500/20">
                    + New ATS Analysis
                  </button>
                </div>

                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="p-5 rounded-2xl bg-slate-900/50 border border-slate-800">
                    <div className="text-[11px] font-bold text-slate-400 uppercase">ATS Score</div>
                    <div className="text-3xl font-black text-indigo-400 mt-1">92%</div>
                  </div>
                  <div className="p-5 rounded-2xl bg-slate-900/50 border border-slate-800">
                    <div className="text-[11px] font-bold text-slate-400 uppercase">Applications</div>
                    <div className="text-3xl font-black text-purple-400 mt-1">{applications.length}</div>
                  </div>
                  <div className="p-5 rounded-2xl bg-slate-900/50 border border-slate-800">
                    <div className="text-[11px] font-bold text-slate-400 uppercase">Readiness</div>
                    <div className="text-3xl font-black text-emerald-400 mt-1">90%</div>
                  </div>
                  <div className="p-5 rounded-2xl bg-slate-900/50 border border-slate-800">
                    <div className="text-[11px] font-bold text-slate-400 uppercase">Roadmap</div>
                    <div className="text-3xl font-black text-amber-400 mt-1">50%</div>
                  </div>
                </div>
              </div>
            )}

            {/* ATS Page */}
            {activePage === 'ats' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-black text-white">ATS Keyword Analyzer</h1>
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <div className="p-5 rounded-2xl bg-slate-900/50 border border-slate-800 space-y-3">
                    <label className="text-xs font-bold text-slate-300">Resume Content</label>
                    <textarea
                      rows={6}
                      value={resumeText}
                      onChange={e => setResumeText(e.target.value)}
                      className="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 resize-none"
                    />
                  </div>
                  <div className="p-5 rounded-2xl bg-slate-900/50 border border-slate-800 space-y-3">
                    <label className="text-xs font-bold text-slate-300">Target Job Description</label>
                    <textarea
                      rows={6}
                      value={jobDesc}
                      onChange={e => setJobDesc(e.target.value)}
                      className="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 resize-none"
                    />
                  </div>
                </div>

                <div className="text-center">
                  <button
                    onClick={handleAnalyze}
                    disabled={isAnalyzing}
                    className="px-8 py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-sm shadow-xl shadow-indigo-500/20"
                  >
                    {isAnalyzing ? "Scanning..." : "Run Enterprise ATS Scan"}
                  </button>
                </div>

                {atsResult && (
                  <div className="p-6 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-4">
                    <div className="flex items-center justify-between">
                      <span className="font-bold text-slate-300">Overall ATS Score</span>
                      <span className="text-3xl font-black text-emerald-400">{atsResult.score}%</span>
                    </div>
                    <div>
                      <div className="text-xs font-bold text-slate-400 mb-2">Matched Keywords</div>
                      <div className="flex flex-wrap gap-2">
                        {atsResult.keywords.map((k, i) => (
                          <span key={i} className="px-2.5 py-1 rounded-md bg-emerald-500/10 text-emerald-400 text-xs font-semibold">{k}</span>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Mock Interview */}
            {activePage === 'interview' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-black text-white">Interactive AI Mock Interview</h1>
                <div className="p-6 rounded-2xl bg-slate-900/50 border border-slate-800 min-h-[400px] flex flex-col justify-between space-y-4">
                  <div className="space-y-3 max-h-[350px] overflow-y-auto">
                    {messages.map(m => (
                      <div key={m.id} className={`p-3.5 rounded-xl text-xs ${m.sender === 'user' ? 'bg-indigo-600 text-white ml-auto max-w-md' : 'bg-slate-950 border border-slate-800 text-slate-200 max-w-lg'}`}>
                        {m.text}
                      </div>
                    ))}
                  </div>

                  <div className="flex items-center gap-2 pt-2 border-t border-slate-800">
                    <input
                      type="text"
                      value={userInput}
                      onChange={e => setUserInput(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && handleSendMessage()}
                      placeholder="Type your STAR interview response..."
                      className="flex-1 p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white"
                    />
                    <button onClick={handleSendMessage} className="px-5 py-3 rounded-xl bg-purple-600 text-white text-xs font-bold">
                      Send
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Job Tracker */}
            {activePage === 'tracker' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-black text-white">Job Application Kanban</h1>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {['Wishlist', 'Applied', 'Interview', 'Offer'].map(col => (
                    <div key={col} className="p-4 rounded-2xl bg-slate-900/40 border border-slate-800 space-y-3">
                      <div className="font-bold text-xs uppercase text-slate-400">{col}</div>
                      {applications.filter(a => a.status === col).map(app => (
                        <div key={app.id} className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 space-y-1">
                          <div className="font-bold text-xs text-white">{app.role}</div>
                          <div className="text-[11px] text-slate-400">{app.company} • {app.location}</div>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Pricing */}
            {activePage === 'pricing' && (
              <div className="space-y-8">
                <div className="text-center space-y-2">
                  <h1 className="text-3xl font-black text-white">Pricing Plans</h1>
                  <p className="text-xs text-slate-400">Upgrade for unlimited Gemini AI scans and mock interviews.</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="p-6 rounded-2xl bg-slate-900/40 border border-slate-800 space-y-4">
                    <h3 className="font-bold text-white text-lg">Starter</h3>
                    <div className="text-3xl font-black text-white">$0</div>
                    <p className="text-xs text-slate-400">Basic ATS keyword checks.</p>
                  </div>
                  <div className="p-6 rounded-2xl bg-slate-900 border-2 border-indigo-500 space-y-4">
                    <h3 className="font-bold text-white text-lg">Pro Candidate</h3>
                    <div className="text-3xl font-black text-white">$19<span className="text-xs text-slate-400">/mo</span></div>
                    <p className="text-xs text-slate-400">Unlimited scans & mock interviews.</p>
                  </div>
                  <div className="p-6 rounded-2xl bg-slate-900/40 border border-slate-800 space-y-4">
                    <h3 className="font-bold text-white text-lg">Executive</h3>
                    <div className="text-3xl font-black text-white">$49<span className="text-xs text-slate-400">/mo</span></div>
                    <p className="text-xs text-slate-400">1-on-1 human expert review.</p>
                  </div>
                </div>
              </div>
            )}
          </main>

          <footer className="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
            &copy; {new Date().getFullYear()} AI Resume Coach Enterprise SaaS Platform. All rights reserved.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
